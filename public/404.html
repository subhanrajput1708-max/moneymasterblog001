<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Money Master Blog</title>
    <script type="text/javascript">
      // Clean SPA redirect for GitHub Pages without '#' hash fragments
      // Converts path to query parameter '/?p=/...' so index.html restores clean URL
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Money Master Blog...</p>
  </body>
</html>
